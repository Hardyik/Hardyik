name: Metrics
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}   # PAT with: repo, read:org, read:user
          user: Hardyik
          template: classic
          base: header, activity, community
          config_timezone: Asia/Kolkata
          filename: github-metrics.svg

          # --- the plugin that caused "Unexpected error" is simply NOT enabled ---
          plugin_habits: no

          plugin_isometric: yes
          plugin_isometric_duration: half-year

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 30
